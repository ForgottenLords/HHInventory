{% comment %}
Styles and behaviour for the shared product edit form. Belongs in <head>, because Vue strips
<style> and <script> out of the markup it renders, which would take the form's styling with it.

Pairs with partials/product_edit_modal.html, which holds the markup and goes inside the Vue root.
See that file for what an including page has to provide.

Every rule is scoped to .edit-modal, so dropping the form onto a page cannot restyle inputs the
page already has of its own.
{% endcomment %}
<style>
  .edit-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .edit-modal {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .edit-modal h2 { margin: 0 0 16px; font-size: 1.05rem; }
  .edit-modal .edit-error {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #fdecea;
    color: #b3261e;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .edit-modal .edit-hint {
    font-size: 0.78rem;
    color: #888;
    margin: -8px 0 14px;
  }
  .edit-modal .edit-field-error {
    color: #b3261e;
    font-size: 0.8rem;
    margin: -8px 0 14px;
  }
  .edit-modal input.is-invalid,
  .edit-modal select.is-invalid,
  .edit-modal textarea.is-invalid,
  .edit-modal .edit-input-group.is-invalid input,
  .edit-modal .edit-input-group.is-invalid .edit-input-addon {
    border-color: #b3261e;
  }
  .edit-modal .edit-loading { text-align: center; color: #888; padding: 24px 0; }
  .edit-modal .edit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0 16px;
  }
  .edit-modal .edit-grid .full { grid-column: 1 / -1; }
  .edit-modal .edit-section {
    grid-column: 1 / -1;
    margin: 6px 0 12px;
    padding-top: 12px;
    border-top: 1px solid #eee;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
  }
  .edit-modal label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
  }
  .edit-modal input[type=text],
  .edit-modal input[type=number],
  .edit-modal input[type=date],
  .edit-modal textarea,
  .edit-modal select {
    width: 100%;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    color: #333;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .edit-modal textarea { resize: vertical; }
  .edit-modal .edit-input-group { display: flex; margin-bottom: 14px; }
  .edit-modal .edit-input-group input {
    min-width: 0;
    margin-bottom: 0;
    border-radius: 0;
  }
  .edit-modal .edit-input-addon {
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 0.9rem;
    color: #666;
    background: #f4f4f4;
    border: 1px solid #ccc;
    border-radius: 0;
  }
  .edit-modal .edit-input-group > :first-child {
    border-radius: 8px 0 0 8px;
  }
  .edit-modal .edit-input-group > :last-child {
    border-radius: 0 8px 8px 0;
  }
  .edit-modal .edit-input-group > :not(:first-child) {
    border-left: none;
  }
  .edit-modal .edit-choices { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .edit-modal .edit-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 6px 10px;
    font-size: 0.8rem;
    font-weight: 500;
    border: 1px solid #ccc;
    border-radius: 999px;
    cursor: pointer;
  }
  .edit-modal .edit-chip.selected { border-color: #3b6fd6; background: #eaf0fd; color: #3b6fd6; }
  .edit-modal .edit-chip input { width: 14px; height: 14px; margin: 0; }
  .edit-modal .edit-check {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .edit-modal .edit-check input { width: 16px; height: 16px; margin: 0; }
  .edit-modal .edit-warning {
    background: #fdecea;
    color: #b3261e;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .edit-modal .edit-warning .edit-check { margin-bottom: 8px; color: #b3261e; }
  .edit-modal .edit-warning .edit-hint { color: #8f2f28; margin-bottom: 0; }
  .edit-modal .edit-warning .edit-hint + .edit-hint { margin-top: 6px; }
  .edit-modal .edit-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .edit-modal .edit-actions button {
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .edit-modal .edit-actions .cancel { background: #eee; color: #333; }
  .edit-modal .edit-actions .cancel:disabled { color: #aaa; cursor: not-allowed; }
  .edit-modal .edit-actions .save { background: #3b6fd6; color: #fff; }
  .edit-modal .edit-actions .save:disabled { background: #9db4e8; cursor: not-allowed; }
</style>

<script>
//The form is filled from a fresh read rather than from whatever the page already holds, so a
//list showing four columns can open the same form as a detail page showing everything. Choices
//come along in the same round trip, so the form can offer every option the model allows.
const PRODUCT_EDIT_QUERY = `
  query ProductForEdit($id: ID!) {
    product(id: $id) {
      id
      name
      barcode
      brand
      countryOfOrigin
      estimatedPrice
      notes
      disallowed
      isReviewed
      reviewedAt
      reviewedBy { username }
      canEditDisallowed { allowed reason }
      canMarkReviewed { allowed reason }
      food {
        lifeStages { value }
        proteins { value }
        specialDiet { value }
        kibble { weight kibbleSize { value } }
        canned { texture { value } }
      }
    }
    productChoices {
      lifeStages { value label }
      proteins { value label }
      specialDiets { value label }
      kibbleSizes { value label }
      textures { value label }
    }
  }
`;

//Arguments left out of the variables are omitted from the call, so one document serves every
//product type: a plain product simply never sends the food, kibble or canned fields.
//disallowed / markReviewed are only declared when Product permissions allow them.
function updateProductMutation(canEditDisallowed, canMarkReviewed) {
  return `
  mutation UpdateProduct(
    $id: ID!
    $name: String
    $barcode: String
    $brand: String
    $countryOfOrigin: String
    $estimatedPrice: Decimal
    $notes: String
    ${canEditDisallowed ? "$disallowed: Boolean" : ""}
    ${canMarkReviewed ? "$markReviewed: Boolean" : ""}
    $lifeStages: String
    $proteins: [String!]
    $specialDiet: [String!]
    $weight: Float
    $kibbleSize: String
    $texture: String
  ) {
    updateProduct(
      id: $id
      name: $name
      barcode: $barcode
      brand: $brand
      countryOfOrigin: $countryOfOrigin
      estimatedPrice: $estimatedPrice
      notes: $notes
      ${canEditDisallowed ? "disallowed: $disallowed" : ""}
      ${canMarkReviewed ? "markReviewed: $markReviewed" : ""}
      lifeStages: $lifeStages
      proteins: $proteins
      specialDiet: $specialDiet
      weight: $weight
      kibbleSize: $kibbleSize
      texture: $texture
    ) {
      ok
      error
      fieldErrors { field message }
    }
  }
`;
}

//Django field names from UpdateProduct.fieldErrors -> input ids in the edit form.
const EDIT_FIELD_IDS = {
  name: "edit-name",
  barcode: "edit-barcode",
  brand: "edit-brand",
  country_of_origin: "edit-country",
  estimated_price: "edit-price",
  notes: "edit-notes",
  disallowed: "edit-disallowed",
  life_stages: "edit-life-stages",
  weight: "edit-weight",
  kibble_size: "edit-kibble-size",
  texture: "edit-texture",
};

function storedChoiceValue(choice) {
  return choice ? choice.value : "";
}

function productEditFormState(product) {
  const food = product.food;
  return {
    name: product.name,
    barcode: product.barcode,
    brand: product.brand,
    countryOfOrigin: product.countryOfOrigin,
    //Held as text so a price keeps the exact decimals the user typed
    estimatedPrice: product.estimatedPrice === null ? "" : String(product.estimatedPrice),
    notes: product.notes,
    disallowed: Boolean(product.disallowed),
    markReviewed: Boolean(product.isReviewed),
    lifeStages: storedChoiceValue(food && food.lifeStages),
    proteins: food ? food.proteins.map((choice) => choice.value) : [],
    specialDiet: food ? food.specialDiet.map((choice) => choice.value) : [],
    weight: food && food.kibble ? food.kibble.weight : null,
    kibbleSize: storedChoiceValue(food && food.kibble && food.kibble.kibbleSize),
    texture: storedChoiceValue(food && food.canned && food.canned.texture),
  };
}

const productEditForm = {
  data() {
    return {
      showEditForm: false,
      editFormTitle: "Edit Product",
      editProduct: null,
      editChoices: { lifeStages: [], proteins: [], specialDiets: [], kibbleSizes: [], textures: [] },
      form: {},
      formError: "",
      fieldErrors: {},
      loadingForm: false,
      saving: false,
    };
  },
  methods: {
    clearEditFieldError(event) {
      const el = event && event.target;
      if (!el || !el.id || !this.fieldErrors[el.id]) return;
      el.classList.remove("is-invalid");
      const group = el.closest(".edit-input-group");
      if (group) group.classList.remove("is-invalid");
      const next = { ...this.fieldErrors };
      delete next[el.id];
      this.fieldErrors = next;
      if (!Object.keys(next).length) this.formError = "";
    },
    focusEditField(fieldId) {
      const el = document.getElementById(fieldId);
      if (!el) return;
      el.classList.add("is-invalid");
      this.$nextTick(() => {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        try {
          el.focus({ preventScroll: true });
        } catch (_) {
          el.focus();
        }
      });
    },
    //Maps UpdateProduct.fieldErrors onto the form's fieldErrors keys; leftovers stay in formError.
    applyServerFieldErrors(serverErrors, fallbackError) {
      const mapped = {};
      const unmapped = [];
      (serverErrors || []).forEach((err) => {
        const id = err.field ? EDIT_FIELD_IDS[err.field] : null;
        if (id) {
          mapped[id] = err.message;
        } else if (err.message) {
          unmapped.push(err.message);
        }
      });
      this.fieldErrors = mapped;
      this.formError = unmapped.join(" ") || (Object.keys(mapped).length ? "" : (fallbackError || "Could not save."));
      const firstId = Object.keys(mapped)[0];
      if (firstId) this.focusEditField(firstId);
    },
    async askEditProduct(id, options) {
      //Opened before the read finishes, so a slow load is visible in the dialog rather than as
      //a button that appears to have done nothing
      const opts = options || {};
      this.showEditForm = true;
      this.editFormTitle = opts.title || "Edit Product";
      this.formError = "";
      this.fieldErrors = {};
      this.editProduct = null;
      this.loadingForm = true;
      try {
        const data = await graphql(PRODUCT_EDIT_QUERY, { id });
        if (!data.product) throw new Error("This product no longer exists.");
        this.editChoices = data.productChoices;
        this.form = productEditFormState(data.product);
        this.editProduct = data.product;
      } catch (e) {
        this.formError = e.message;
      } finally {
        this.loadingForm = false;
      }
    },
    closeEditForm() {
      if (this.saving) return;
      this.showEditForm = false;
    },
    editVariables() {
      const form = this.form;
      const canEditDisallowed = !!(
        this.editProduct.canEditDisallowed && this.editProduct.canEditDisallowed.allowed
      );
      const canMarkReviewed = !!(
        this.editProduct.canMarkReviewed && this.editProduct.canMarkReviewed.allowed
      );
      const variables = {
        id: this.editProduct.id,
        name: form.name,
        barcode: form.barcode,
        brand: form.brand,
        countryOfOrigin: form.countryOfOrigin,
        estimatedPrice: form.estimatedPrice === "" ? null : String(form.estimatedPrice),
        notes: form.notes,
      };
      if (canEditDisallowed) {
        variables.disallowed = Boolean(form.disallowed);
      }
      if (canMarkReviewed) {
        variables.markReviewed = Boolean(form.markReviewed);
      }
      if (this.editProduct.food) {
        variables.lifeStages = form.lifeStages;
        variables.proteins = form.proteins;
        variables.specialDiet = form.specialDiet;
        if (this.editProduct.food.kibble) {
          const weight = form.weight;
          variables.weight =
            weight === "" || weight === null || weight === undefined || Number.isNaN(weight)
              ? null
              : weight;
          variables.kibbleSize = form.kibbleSize;
        }
        if (this.editProduct.food.canned) {
          variables.texture = form.texture;
        }
      }
      return variables;
    },
    async submitEditForm() {
      this.formError = "";
      this.fieldErrors = {};
      this.saving = true;
      try {
        const canEditDisallowed = !!(
          this.editProduct.canEditDisallowed && this.editProduct.canEditDisallowed.allowed
        );
        const canMarkReviewed = !!(
          this.editProduct.canMarkReviewed && this.editProduct.canMarkReviewed.allowed
        );
        const data = await graphql(
          updateProductMutation(canEditDisallowed, canMarkReviewed),
          this.editVariables()
        );
        if (!data.updateProduct.ok) {
          this.applyServerFieldErrors(
            data.updateProduct.fieldErrors,
            data.updateProduct.error
          );
          return;
        }
        this.showEditForm = false;
        await this.onProductSaved();
      } catch (e) {
        this.formError = e.message;
      } finally {
        this.saving = false;
      }
    },
  },
};
</script>
